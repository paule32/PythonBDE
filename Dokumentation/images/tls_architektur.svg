  </g>
  <path d="M62 143H105 M235 143H278" stroke="#227855" stroke-width="2"/>
  <text x="170" y="183" text-anchor="middle" font-size="10" font-family="Arial, sans-serif" fill="#3B4856">TCP-Port 43650</text>
