<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="585" viewBox="0 0 340 195" role="img" aria-label="TLS-Verbindung zwischen RPC Client und BDE Server">
  <title>TLS-Verbindung zwischen RPC Client und BDE Server</title>
  <rect width="340" height="195" rx="12" fill="#F7F9FC"/>
  <rect x="7" y="8" width="110" height="52" rx="7" fill="#244A76"/>
  <rect x="223" y="8" width="110" height="52" rx="7" fill="#244A76"/>
  <g fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle" font-family="Arial, sans-serif">
    <text x="62" y="29">RPC Client</text>
    <text x="62" y="45">QSslSocket</text>
    <text x="278" y="29">BDE Server</text>
    <text x="278" y="45">QSslSocket</text>
  </g>
  <line x1="62" y1="60" x2="62" y2="180" stroke="#919CAD" opacity=".65" stroke-dasharray="4 4"/>
  <line x1="278" y1="60" x2="278" y2="180" stroke="#919CAD" opacity=".65" stroke-dasharray="4 4"/>
  <rect x="120" y="73" width="100" height="37" rx="6" fill="#D1A031"/>
