  </g>
  <path d="M62 91H120 M220 91H278" stroke="#D1A031" stroke-width="2"/>
  <rect x="105" y="126" width="130" height="34" rx="6" fill="#227855"/>
  <g font-family="Arial, sans-serif" fill="#FFFFFF" text-anchor="middle">
    <text x="170" y="140" font-weight="600" font-size="11">TLS-geschützt</text>
